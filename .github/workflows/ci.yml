name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ci.trafficserver.apache.org/proxy-verifier/ubuntu:24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Trust the container workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install formatter dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends lbzip2

      - name: Format
        run: bash -e tools/format.sh

      - name: Verify formatting
        run: git diff --exit-code

  rat:
    name: License audit (RAT)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ci.trafficserver.apache.org/proxy-verifier/ubuntu:24.04
    env:
      RAT_VERSION: 0.17
      RAT_SHA256: 401939ebe5a52c6ed524029897bf914eaaba503d36c069ebcdbd8847a9e7cf93
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Java
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends default-jre-headless

      - name: Download Apache RAT
        run: |
          rat_jar="${RUNNER_TEMP}/apache-rat-${RAT_VERSION}.jar"
          curl --fail --location --silent --show-error \
            --output "${rat_jar}" \
            "https://repo.maven.apache.org/maven2/org/apache/rat/apache-rat/${RAT_VERSION}/apache-rat-${RAT_VERSION}.jar"
          echo "${RAT_SHA256}  ${rat_jar}" | sha256sum --check
          echo "RAT_JAR=${rat_jar}" >> "${GITHUB_ENV}"

      - name: Run Apache RAT
        run: |
          java -jar "${RAT_JAR}" \
            --input-exclude "**/*.lock" \
            --input-exclude "**/*.md" "**/*.json" "**/*.yaml" "**/*.gold" "**/*.pem" \
            --input-exclude "tests/unit_tests/catch.hpp" \
            --input-exclude "tests/autests/gold_tests/autest-site/default_url_file" \
            --input-exclude-std GIT HIDDEN_DIR HIDDEN_FILE -- \
            "${GITHUB_WORKSPACE}" | tee RAT.txt

      - name: Upload RAT report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rat-report
          path: RAT.txt
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ci.trafficserver.apache.org/proxy-verifier/ubuntu:24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake --preset dev-external

      - name: Build
        run: cmake --build --preset dev-external --parallel

      - name: Run unit tests
        run: ctest --preset dev-external

      - name: Upload unit-test logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-logs
          path: build/dev-external/Testing
          if-no-files-found: ignore

  autests:
    name: AuTests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ci.trafficserver.apache.org/proxy-verifier/ubuntu:24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake --preset dev-external

      - name: Build
        run: cmake --build --preset dev-external --parallel

      - name: Run AuTests
        run: ./build/dev-external/autest.sh --clean=none -j"$(nproc)"

      - name: Collect AuTest logs
        if: failure()
        run: |
          mkdir -p artifacts
          cp -a /tmp/proxy-verifier-autest artifacts/ 2>/dev/null || true

      - name: Upload AuTest logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: autest-logs
          path: artifacts
          if-no-files-found: ignore
