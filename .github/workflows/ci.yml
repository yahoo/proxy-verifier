name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ci.trafficserver.apache.org/proxy-verifier/ubuntu:24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Trust the container workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Format
        run: bash -e tools/format.sh

      - name: Verify formatting
        run: git diff --exit-code

  rat:
    name: License audit (RAT)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ci.trafficserver.apache.org/proxy-verifier/ubuntu:24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trust the container workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Verify copyright years
        run: |
          bash tools/copyright-update.sh
          git diff --exit-code

      - name: Run Apache RAT
        run: |
          java -jar "${RAT_JAR}" \
            --input-exclude "**/*.lock" \
            --input-exclude "**/*.md" "**/*.json" "**/*.yaml" "**/*.gold" "**/*.pem" \
            --input-exclude "tests/unit_tests/catch.hpp" \
            --input-exclude "tests/autests/gold_tests/autest-site/default_url_file" \
            --input-exclude-std GIT HIDDEN_DIR HIDDEN_FILE -- \
            "${GITHUB_WORKSPACE}" | tee "${RUNNER_TEMP}/RAT.txt"

      - name: Upload RAT report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rat-report
          path: ${{ runner.temp }}/RAT.txt
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ci.trafficserver.apache.org/proxy-verifier/ubuntu:24.04
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake --preset dev-external

      - name: Build
        run: cmake --build --preset dev-external --parallel

      - name: Run unit tests
        run: ctest --preset dev-external

      - name: Upload unit-test logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-logs
          path: build/dev-external/Testing
          if-no-files-found: ignore

  autests:
    name: AuTests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ci.trafficserver.apache.org/proxy-verifier/ubuntu:24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake --preset dev-external

      - name: Build
        run: cmake --build --preset dev-external --parallel

      - name: Run AuTests
        run: ./build/dev-external/autest.sh -v --clean=none -j"$(nproc)"

      - name: Collect AuTest sandbox
        if: failure()
        run: |
          mkdir -p artifacts
          if [[ -d /tmp/proxy-verifier-autest ]]; then
            tar --create --gzip \
              --file="${GITHUB_WORKSPACE}/artifacts/autest-sandbox.tar.gz" \
              --directory=/tmp proxy-verifier-autest
          fi

      - name: Upload AuTest sandbox
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: autest-sandbox
          path: artifacts/autest-sandbox.tar.gz
          if-no-files-found: ignore
