meta:
    version: '1.0'

# Five HTTP/1.1 sessions with no start-time nodes. Without session timing data,
# --rate is honored by sleeping a uniform amount of time before each session.

sessions:

- transactions:

  - client-request:
      method: GET
      url: /rate/1
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ Content-Length, '0' ]
        - [ uuid, rate-request-1 ]

    proxy-request:
      url:
      - [ path, { value: /rate/1, as: equal } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, '16' ]

    proxy-response:
      status: 200

