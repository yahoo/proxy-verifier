meta:
    version: '1.0'

# Verify that a response which arrives while the Verifier client is holding a
# request body behind a "content" "delay" is still verified. The test proxy
# answers as soon as the request headers arrive, which is before the delayed
# DATA frame goes out, so the expected response has to be registered on the
# stream before the delay begins. The Content-Length rule below is what detects
# a skipped verification: it is reported as never processed if the response is
# not verified against.

sessions:

- protocol:
    stack: http2
    tls:
      sni: test_sni

  transactions:

  - client-request:
      headers:
        fields:
        - [ :method, POST ]
        - [ :scheme, https ]
        - [ :authority, www.example.com ]
        - [ :path, /pictures/flower.jpeg ]
        - [ Content-Type, image/jpeg ]
        - [ X-Proxy-Directive, "EarlyResponse=%<413%>" ]
        - [ uuid, http2-early-response ]
      content:
        size: 399
        delay: 700ms

    proxy-response:
      status: 413
      headers:
        fields:
        - [ Content-Length, { value: '0', as: equal } ]
