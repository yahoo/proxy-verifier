[project]
name = "proxy-verifier-urtests"
version = "0.1.0"
description = "Pytest dependencies for Proxy Verifier Uranium tests"
requires-python = ">=3.10"

dependencies = [
  "aioquic==1.3.0",
  "eventlet",
  "h2",
  "psutil",
  "pytest>=8.0",
  "pytest-xdist>=3.6",
  "pyOpenSSL",
  "ruamel_yaml",
]

[project.optional-dependencies]
fast-diff = [
  "cdifflib>=1.2.9",
]
dev = [
  "pyflakes",
]
